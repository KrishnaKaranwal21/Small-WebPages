<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA 7-day study tracker</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d5dde8;--acc:#2f5bea;--done:#1f9d7a;--chip:#e6ecf8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#172033;--ink:#e8eefb;--mute:#94a3bd;--line:#2a3750;--acc:#7da2ff;--done:#43c9a0;--chip:#22304c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 8px;letter-spacing:-.01em}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar b{font-weight:600;font-size:.85rem;color:var(--mute)}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:0;background:var(--acc);transition:width .3s}
.fill.lc{background:var(--done)}
main{max-width:980px;margin:0 auto;padding:20px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.day.complete{border-color:var(--done)}
.dh{display:flex;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dn{font-size:2rem;font-weight:700;color:var(--acc);min-width:2.6rem;line-height:1}
.dh h2{margin:0;font-size:1.1rem}
.dh p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.badge{margin-left:auto;font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--chip);white-space:nowrap}
.day.complete .badge{background:var(--done);color:#fff}
.cols{display:grid;grid-template-columns:1.1fr 1fr}
.col{padding:14px 18px}
.col+.col{border-left:1px solid var(--line)}
h3{margin:0 0 8px;font-size:.95rem;color:var(--mute);font-weight:600}
label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
input[type=checkbox]{margin-top:5px;width:17px;height:17px;accent-color:var(--done);flex:none}
label:has(input:checked) .t{text-decoration:line-through;color:var(--mute)}
a{color:var(--acc);text-decoration:none;word-break:break-word}
a:hover{text-decoration:underline}
a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.m{margin-left:auto;font-size:.8rem;color:var(--mute);white-space:nowrap;padding-left:8px}
.E{color:var(--done)}.M{color:#c98a00}.H{color:#d6455d}
.note{margin:10px 0 0;font-size:.85rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:9}#toast.on{opacity:1}
footer{max-width:980px;margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:.85rem}
button{font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
@media(max-width:720px){.cols{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}.bars{grid-template-columns:1fr}.dh{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>DSA 7-day study tracker</h1>
<div class="bars">
<div class="bar"><b id="fl">PDFs: 0 / 21</b><div class="track"><div class="fill" id="ff"></div></div></div>
<div class="bar"><b id="ll">LeetCode: 0 / 0</b><div class="track"><div class="fill lc" id="lf"></div></div></div>
</div></div></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<footer>3 hours a day for 7 days. Progress saves in this browser. <button id="mode">PDF links</button> <button id="reset">Reset progress</button></footer>
<script>
const BASE="file:///Users/user47/Documents/STEP%20Notes/DSA/";
const D="DSA",A="Advance%20DSA";
// [pdf name, folder, minutes]
const days=[
{t:"Foundations: complexity and arrays",s:"Big-O, array basics, array analytics lab",
 f:[["1 - Time-and-Space-Complexity-Analysis.pdf",D,45],["2 - Arrays.pdf",D,50],["DSA Lab 3 - Array Analytics.pdf",D,30]],
 lc:[[217,"Contains Duplicate","contains-duplicate","E"],[121,"Best Time to Buy and Sell Stock","best-time-to-buy-and-sell-stock","E"],[283,"Move Zeroes","move-zeroes","E"],[26,"Remove Duplicates from Sorted Array","remove-duplicates-from-sorted-array","E"],[268,"Missing Number","missing-number","E"],[189,"Rotate Array","rotate-array","M"]],
 n:"LeetCode topics: array traversal, in-place edits, basic complexity reasoning. About 55 min."},
{t:"Strings, arrays and linked lists",s:"Scenarios, interview Q&A, practice set",
 f:[["Strings_Arrays_LinkedLists_Scenarios.pdf",D,40],["Strings_Arrays_LinkedLists_Interview_QA.pdf",D,40],["LeetCode_Practice_Strings_Arrays_LinkedLists.pdf",D,45]],
 lc:[[344,"Reverse String","reverse-string","E"],[242,"Valid Anagram","valid-anagram","E"],[125,"Valid Palindrome","valid-palindrome","E"],[206,"Reverse Linked List","reverse-linked-list","E"],[21,"Merge Two Sorted Lists","merge-two-sorted-lists","E"],[141,"Linked List Cycle","linked-list-cycle","E"],[876,"Middle of the Linked List","middle-of-the-linked-list","E"]],
 n:"LeetCode topics: strings, linked list basics, fast and slow pointers. About 55 min."},
{t:"Prefix sum and Kadane’s algorithm",s:"Range queries and max subarray",
 f:[["Prefix_Sum_Array_Technique_Guide.pdf",D,40],["Prefix Sum Array Technique CheatSheet.pdf",D,15],["Kadanes_Algorithm_Complete_Guide.pdf",D,45],["Kadanes_Algorithm_Cheatsheet.pdf",D,15]],
 lc:[[303,"Range Sum Query - Immutable","range-sum-query-immutable","E"],[724,"Find Pivot Index","find-pivot-index","E"],[238,"Product of Array Except Self","product-of-array-except-self","M"],[560,"Subarray Sum Equals K","subarray-sum-equals-k","M"],[53,"Maximum Subarray","maximum-subarray","M"],[152,"Maximum Product Subarray","maximum-product-subarray","M"],[918,"Maximum Sum Circular Subarray","maximum-sum-circular-subarray","M"]],
 n:"LeetCode topics: prefix sums, running totals, Kadane’s algorithm. About 65 min."},
{t:"Two pointers and deque",s:"Opposite and same-direction pointers, then the double-ended queue",
 f:[["Two_Pointer_Technique_Guide.pdf",D,40],["Two Pointers Technique - Comprehensive Guide.pdf",D,45],["1 - Deque-Double-Ended-Queue.pdf",A,35]],
 lc:[[167,"Two Sum II - Input Array Is Sorted","two-sum-ii-input-array-is-sorted","M"],[977,"Squares of a Sorted Array","squares-of-a-sorted-array","E"],[75,"Sort Colors","sort-colors","M"],[11,"Container With Most Water","container-with-most-water","M"],[15,"3Sum","3sum","M"],[42,"Trapping Rain Water","trapping-rain-water","H"],[641,"Design Circular Deque","design-circular-deque","M"]],
 n:"LeetCode topics: two pointers, sorted-array tricks, deque design. About 60 min."},
{t:"Sliding window",s:"Fixed size, variable size, full guide",
 f:[["Sliding_Window_Technique_Guide.pdf",D,35],["Sliding Window Technique - Comprehensive Guide.pdf",D,45],["Sliding_Window_Fixed_Size.pdf",D,20],["Sliding_Window_Variable_Size.pdf",D,25]],
 lc:[[643,"Maximum Average Subarray I","maximum-average-subarray-i","E"],[1456,"Maximum Number of Vowels in a Substring of Given Length","maximum-number-of-vowels-in-a-substring-of-given-length","M"],[3,"Longest Substring Without Repeating Characters","longest-substring-without-repeating-characters","M"],[209,"Minimum Size Subarray Sum","minimum-size-subarray-sum","M"],[424,"Longest Repeating Character Replacement","longest-repeating-character-replacement","M"],[567,"Permutation in String","permutation-in-string","M"],[239,"Sliding Window Maximum","sliding-window-maximum","H"],[76,"Minimum Window Substring","minimum-window-substring","H"]],
 n:"LeetCode topics: fixed and variable windows, deque-based window max. Do the first six; leave the two hard ones for Day 7 if time runs out. About 55 min."},
{t:"Hashing and hash tables",s:"Hash maps, sets, frequency counting",
 f:[["Hashing_Technique_Guide.pdf",D,40],["Hashing Cheatsheet.pdf",D,15],["Hashing-and-Hash-Tables (1).pdf",A,50]],
 lc:[[1,"Two Sum","two-sum","E"],[383,"Ransom Note","ransom-note","E"],[705,"Design HashSet","design-hashset","E"],[706,"Design HashMap","design-hashmap","E"],[49,"Group Anagrams","group-anagrams","M"],[347,"Top K Frequent Elements","top-k-frequent-elements","M"],[36,"Valid Sudoku","valid-sudoku","M"],[128,"Longest Consecutive Sequence","longest-consecutive-sequence","M"]],
 n:"LeetCode topics: hash maps, frequency counts, grouping, hash set lookups. About 75 min."},
{t:"Problem statement and revision",s:"Apply everything, revise cheatsheets, redo weak problems",
 f:[["StreamVerse Media Engineering Hackathon - Problem Statement.pdf",D,40]],
 g:{t:"Skim all cheatsheets",m:30,i:[["Prefix Sum Array Technique CheatSheet.pdf",D],["Kadanes_Algorithm_Cheatsheet.pdf",D],["Hashing Cheatsheet.pdf",D]]},
 lc:[[438,"Find All Anagrams in a String","find-all-anagrams-in-a-string","M"],[1004,"Max Consecutive Ones III","max-consecutive-ones-iii","M"],[76,"Minimum Window Substring (retry)","minimum-window-substring","H"],[239,"Sliding Window Maximum (retry)","sliding-window-maximum","H"],[560,"Subarray Sum Equals K (redo)","subarray-sum-equals-k","M"],[15,"3Sum (redo)","3sum","M"],[3,"Longest Substring Without Repeating Characters (redo)","longest-substring-without-repeating-characters","M"]],
 n:"LeetCode topics: mixed review across sliding window, prefix sum and two pointers. About 110 min."}
];
let st={};
try{st=JSON.parse(localStorage.getItem("dsa7")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("dsa7",JSON.stringify(st))}catch(e){}};
const app=document.getElementById("app");
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
days.forEach((d,i)=>{
 const n=i+1;
 const rows=(d.f||[]).map((f,j)=>{const id=`d${n}f${j}`;
  return `<label><input type="checkbox" data-k="${id}" data-t="f"><span class="t"><a data-dir="${f[1]}" data-n="${encodeURIComponent(f[0])}" target="_blank">${esc(f[0])}</a></span><span class="m">${f[2]} min</span></label>`}).join("")
  +(d.g?`<p class="note"><b>${d.g.t}</b> (${d.g.m} min total)</p>`+d.g.i.map((x,j)=>{const id=`d${n}x${j}`;return `<label style="padding-left:14px"><input type="checkbox" data-k="${id}" data-t="x"><span class="t"><a data-dir="${x[1]}" data-n="${encodeURIComponent(x[0])}" target="_blank">${esc(x[0])}</a></span></label>`}).join(""):"");
 const lc=d.lc.map((p,j)=>{const id=`d${n}l${j}`;
  return `<label><input type="checkbox" data-k="${id}" data-t="l"><span class="t"><a href="https://leetcode.com/problems/${p[2]}/" target="_blank" rel="noopener">${p[0]}. ${esc(p[1])}</a></span><span class="m ${p[3]}">${{E:"Easy",M:"Medium",H:"Hard"}[p[3]]}</span></label>`}).join("");
 const card=el(`<section class="day" id="day${n}"><div class="dh"><div class="dn">${n}</div><div><h2>${d.t}</h2><p>${d.s}</p></div><span class="badge"></span></div><div class="cols"><div class="col"><h3>Study these files</h3>${rows}</div><div class="col"><h3>Then solve on LeetCode</h3>${lc}<p class="note">${d.n}</p></div></div></section>`);
 app.appendChild(card);
});
const boxes=[...document.querySelectorAll("input[type=checkbox]")];
boxes.forEach(b=>{b.checked=!!st[b.dataset.k];b.addEventListener("change",()=>{st[b.dataset.k]=b.checked;save();upd()})});
function upd(){
 const c=t=>boxes.filter(b=>b.dataset.t===t);
 const fs=c("f"),ls=c("l");
 const fd=fs.filter(b=>b.checked).length,ld=ls.filter(b=>b.checked).length;
 fl.textContent=`PDFs: ${fd} / ${fs.length}`;ll.textContent=`LeetCode: ${ld} / ${ls.length}`;
 ff.style.width=100*fd/fs.length+"%";lf.style.width=100*ld/ls.length+"%";
 document.querySelectorAll(".day").forEach(s=>{
  const bs=[...s.querySelectorAll("input")],d=bs.filter(b=>b.checked).length;
  s.querySelector(".badge").textContent=d===bs.length?"Day complete":`${d} / ${bs.length} done`;
  s.classList.toggle("complete",d===bs.length)});
}
function setLinks(){
 const m=st.mode||"file";
 document.querySelectorAll("a[data-n]").forEach(a=>{a.href=(m==="file"?BASE:"DSA/")+a.dataset.dir+"/"+a.dataset.n});
 document.getElementById("mode").textContent=m==="file"?"PDF links: local file:// (switch to relative)":"PDF links: relative (switch to local file://)";
}
document.getElementById("mode").onclick=()=>{st.mode=(st.mode||"file")==="file"?"rel":"file";save();setLinks()};
setLinks();
const toast=document.getElementById("toast");let tt;
document.addEventListener("click",e=>{
 const a=e.target.closest("a[data-n]");
 if(!a||location.protocol==="file:"||!a.href.startsWith("file:"))return;
 e.preventDefault();
 const say=m=>{toast.textContent=m;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),4500)};
 const ok=()=>say("Browsers block file links on hosted pages. Path copied: press Cmd+T, then Cmd+V, then Enter.");
 (navigator.clipboard?navigator.clipboard.writeText(a.href).then(ok):Promise.reject()).catch(()=>say("Browsers block file links on hosted pages. Right-click the link and choose Copy Link, then paste it in a new tab."));
});
document.getElementById("reset").onclick=()=>{if(confirm("Clear all progress?")){st={};save();boxes.forEach(b=>b.checked=false);upd()}};
upd();
</script>
</body>
</html>
