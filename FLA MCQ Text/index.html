const U={u2:"Unit II",u3:"Unit III"},S={sample:"Sample (from PDF)",extra:"Additional (harder)",univ:"University Exam Qs"};

/* ---------- persistence (localStorage, with in-memory fallback) ---------- */
const KEY="fla-quiz-v1";
let store={sec:"sample",unit:"u2",boards:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object"){store=Object.assign(store,s);if(!store.boards||typeof store.boards!=="object")store.boards={}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let sec=D[store.sec]?store.sec:"sample",unit=D[sec][store.unit]?store.unit:"u2";

const $=i=>document.getElementById(i);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=n=>Array.from({length:n},(_,i)=>i);

// A board = saved state for one (section, unit): question order, option order per question, picked answers
function newBoard(L){const opts={};L.forEach((q,i)=>opts[i]=sh(range(1+q[2].length)));return{order:sh(range(L.length)),opts,picked:{}}}
function validBoard(b,L){
  if(!b||!Array.isArray(b.order)||b.order.length!==L.length||!b.opts||!b.picked)return false;
  if(!b.order.every(i=>Number.isInteger(i)&&i>=0&&i<L.length)||new Set(b.order).size!==L.length)return false;
  return L.every((q,i)=>Array.isArray(b.opts[i])&&b.opts[i].length===1+q[2].length&&new Set(b.opts[i]).size===b.opts[i].length)}
function getBoard(){
  const key=sec+"|"+unit,L=D[sec][unit];let b=store.boards[key];
  if(!validBoard(b,L)){b=store.boards[key]=newBoard(L);save()}
  return b}

function tabs(){
  $("st").innerHTML=Object.keys(S).map(k=>`<button class="tab ${k==sec?"on":""}" data-s="${k}">${S[k]} (${D[k].u2.length+D[k].u3.length})</button>`).join("");
  $("ut").innerHTML=Object.keys(U).map(k=>`<button class="tab ${k==unit?"on":""}" data-u="${k}">${U[k]} (${D[sec][k].length})</button>`).join("")}

function render(){
  tabs();
  const L=D[sec][unit],b=getBoard(),box=$("qs");
  store.sec=sec;store.unit=unit;save();
  function score(){
    totals();
    const keys=Object.keys(b.picked);
    $("sc").textContent=`Answered ${keys.length}/${L.length} · Correct ${keys.filter(k=>b.picked[k]===0).length}`}
  score();box.innerHTML="";
  b.order.forEach((qi,pos)=>{
    const q=L[qi],all=[q[1],...q[2]],c=document.createElement("div");c.className="q";
    c.innerHTML=`<div class="n">Q${pos+1}${sec=="extra"?' · <span class="hd">Hard</span>':""}</div><h3>${q[0]}</h3>`;
    const e=document.createElement("div");e.className="e";e.innerHTML="<b>Explanation:</b> "+q[3];
    const bs=b.opts[qi].map((oi,k)=>{
      const btn=document.createElement("button");btn.className="o";btn.textContent="ABCD"[k]+") "+all[oi];
      btn.onclick=()=>{if(b.picked[qi]!==undefined)return;b.picked[qi]=oi;save();reveal()};
      c.appendChild(btn);return btn});
    function reveal(){
      const p=b.picked[qi];if(p===undefined)return;
      bs.forEach((x,j)=>{x.disabled=true;const oi=b.opts[qi][j];if(oi===0)x.classList.add("ok");else if(oi===p)x.classList.add("no")});
      e.classList.add("s");score()}
    c.appendChild(e);box.appendChild(c);reveal()})}

function totals(){let d=0,r=0,n=0;for(const s in D)for(const u in D[s]){const L=D[s][u];n+=L.length;const b=store.boards[s+"|"+u];if(validBoard(b,L)){const k=Object.keys(b.picked);d+=k.length;r+=k.filter(x=>b.picked[x]===0).length}}$("tot").textContent=`Total done ${d}/${n} · Correct ${r}`}
let rsaT;
function disarm(){clearTimeout(rsaT);const x=$("rsa");delete x.dataset.arm;x.textContent="🔀 Reshuffle & reset ALL"}
function resetAll(){const x=$("rsa");if(!x.dataset.arm){x.dataset.arm=1;x.textContent="⚠ Click again to confirm";rsaT=setTimeout(disarm,3000);return}disarm();for(const s in D)for(const u in D[s])store.boards[s+"|"+u]=newBoard(D[s][u]);save();render();window.scrollTo(0,0)}
function reshuffle(){
  store.boards[sec+"|"+unit]=newBoard(D[sec][unit]);save();render();window.scrollTo(0,0)}

document.addEventListener("click",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.s){sec=t.dataset.s;if(!D[sec][unit])unit="u2";render()}
  else if(t.dataset&&t.dataset.u){unit=t.dataset.u;render()}});
$("rs").onclick=reshuffle;$("rsa").onclick=resetAll;render();
</script></body></html>
