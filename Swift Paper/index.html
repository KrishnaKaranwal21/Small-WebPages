<ul>
<li><b>Value type</b> — copied on assignment/pass to functions; each copy is independent.</li>
<li>Gets a free <b>memberwise initializer</b> if you don't write your own.</li>

    var x = 0, y = 0
    mutating func moveBy(dx: Int, dy: Int) {
        x += dx; y += dy

p.moveBy(dx: 3, dy: 1)   // p = (4, 3)
let q = Point(x: 0, y: 0)

progs:[
 {t:"Book (Comparable, optional rating, descending sort with nils last)",body:`struct Book conforming to Comparable: id:Int, title:String, rating:Double?.
Sort descending by rating; nil ratings go last; ties broken alphabetically by title. Demonstrate with .sorted().`,
 sol:`struct Book: Comparable {
    let id: Int
    let title: String
    let rating: Double?

    static func < (lhs: Book, rhs: Book) -> Bool {
        switch (lhs.rating, rhs.rating) {
        case let (r1?, r2?):
            if r1 != r2 { return r1 > r2 }        // higher first
            return lhs.title < rhs.title
        case (.some, .none): return true
        case (.none, .some): return false
        case (.none, .none): return lhs.title < rhs.title
        }
    }
    static func == (lhs: Book, rhs: Book) -> Bool {
        lhs.id == rhs.id && lhs.title == rhs.title && lhs.rating == rhs.rating
    }
}
let library = [Book(id:1,title:"Swift Basics",rating:4.5),
               Book(id:2,title:"Advanced iOS",rating:nil),
               Book(id:3,title:"Data Structures",rating:4.8)]
print(library.sorted())`},
 {t:"Vector2D struct with mutating scale + Equatable",body:`Create struct Vector2D {x:Double, y:Double} with a mutating func scale(by factor: Double). Conform to Equatable and demonstrate adding two vectors via a static + operator.`,
 sol:`struct Vector2D: Equatable {
    var x: Double, y: Double
    mutating func scale(by factor: Double) {
        x *= factor; y *= factor
    }
    static func + (lhs: Vector2D, rhs: Vector2D) -> Vector2D {
        Vector2D(x: lhs.x + rhs.x, y: lhs.y + rhs.y)
    }
}
var v1 = Vector2D(x: 1, y: 2)
v1.scale(by: 3)                 // (3, 6)
let v2 = Vector2D(x: 1, y: 1)
print(v1 + v2)                  // (4, 7)
print(v1 == Vector2D(x:3,y:6))  // true`}
]},

class Member: User {

 {t:"Shape hierarchy: Shape base class, area override",body:`Create class Shape with a method area() -> Double returning 0. Subclasses Circle(radius) and Rectangle(w,h) override area(). Write a function totalArea(_ shapes:[Shape]) -> Double summing all areas using reduce.`,
 sol:`class Shape {
    func area() -> Double { 0 }
}
class Circle: Shape {
    let radius: Double
    init(radius: Double) { self.radius = radius }
    override func area() -> Double { .pi * radius * radius }
}
class Rectangle: Shape {
    let w: Double, h: Double
    init(w: Double, h: Double) { self.w = w; self.h = h }
    override func area() -> Double { w * h }
}
func totalArea(_ shapes: [Shape]) -> Double {
    shapes.reduce(0) { $0 + $1.area() }
}
let shapes: [Shape] = [Circle(radius: 2), Rectangle(w: 3, h: 4)]
print(totalArea(shapes))`}

 {t:"Remove duplicates while preserving first-seen order",body:`Given an array of Ints with duplicates, return a new array with duplicates removed, preserving original order (don't just use Set(), since that loses order).`,
 sol:`func dedupePreserveOrder(_ nums: [Int]) -> [Int] {
    var seen = Set<Int>()
    var result: [Int] = []
    for n in nums where !seen.contains(n) {
        seen.insert(n)
        result.append(n)
    }
    return result
}
print(dedupePreserveOrder([4,1,4,2,3,1,5])) // [4,1,2,3,5]`}

{id:"optionals", name:"Optionals", notes:`
<ul>
<li>An optional (<code>Type?</code>) either holds a value or <code>nil</code>. Force-unwrapping (<code>!</code>) a nil crashes at runtime.</li>
<li><code>if let</code> / <code>guard let</code> safely unwrap. Guard's <code>else</code> block <b>must</b> exit scope (return/break/continue/throw).</li>

{id:"protocols", name:"Protocols", notes:`
<ul>
<li>A protocol declares requirements (properties/methods); types <b>conform</b> by implementing them. Structs need <code>mutating</code> on methods that change state.</li>
<li>Conforming to <code>Comparable</code>: implement <code>&lt;</code> and <code>==</code> (via Equatable); Swift's protocol extensions give you <code>&gt;, &lt;=, &gt;=</code> for free.</li>
<li>Protocols can be used as types; check/cast with <code>is</code> / <code>as?</code>.</li>
</ul>`,
code:`protocol Greetable { var name: String { get } }
extension Greetable {
    func greet() -> String { "Hello, \\(name)!" }   // default implementation
}
struct Visitor: Greetable { let name: String }
print(Visitor(name: "Amit").greet())`,
mcqs:[
 {q:"To conform to Comparable, which operator(s) must you implement yourself?",opts:["Both < and >","Only <, (== comes from Equatable)","All four: <,>,<=,>=","None, it's automatic"],a:"Only <, (== comes from Equatable)",r:"Swift's standard library supplies default >, <=, >= once < and == are defined."},
 {q:"A protocol declares <code>mutating func restock(by:)</code>. What does a conforming struct need?",opts:["Nothing special","Mark its implementation 'mutating' too","Use a class instead","Make the property computed"],a:"Mark its implementation 'mutating' too",r:"Since structs are value types, any protocol method that mutates state must be marked mutating in both the protocol and the conforming struct."},
 {q:"What does <code>if let v = item as? SomeProtocol</code> do?",opts:["Force-casts, crashing on failure","Attempts a conditional cast, returning nil on failure","Always succeeds","Only works with classes"],a:"Attempts a conditional cast, returning nil on failure",r:"as? performs an optional (safe) downcast/protocol-cast, yielding nil rather than crashing if it fails."},
 {q:"Can one protocol inherit requirements from another protocol?",opts:["No, protocols can't inherit","Yes, using protocol A: B syntax, just like class inheritance","Only if both are class-only protocols","Only via an extension"],a:"Yes, using protocol A: B syntax, just like class inheritance",r:"A protocol can inherit one or more other protocols, inheriting all their requirements."},
 {q:"What does restricting a protocol with <code>protocol Foo: AnyObject</code> mean?",opts:["Only structs can conform to Foo","Only classes can conform to Foo","Any type at all can conform","It requires Codable conformance too"],a:"Only classes can conform to Foo",r:"Constraining a protocol to AnyObject limits conformance to reference types (classes) only — useful for delegate patterns."},
 {q:"How does a type conform to multiple protocols at once?",opts:["It's not possible in Swift","struct X: ProtocolA, ProtocolB { }","struct X: ProtocolA & ProtocolB { } only in declarations","Using a tuple of protocols"],a:"struct X: ProtocolA, ProtocolB { }",r:"List multiple protocols comma-separated after the colon to conform to all of them."},
 {q:"If a protocol extension provides a default implementation of a method, can a conforming type override it?",opts:["No, defaults are final","Yes, the conforming type can supply its own implementation instead","Only classes can override, structs can't","Only if the method is marked 'open'"],a:"Yes, the conforming type can supply its own implementation instead",r:"A conforming type's own implementation takes precedence over the protocol extension's default."},
 {q:"What does <code>ProtocolA & ProtocolB</code> express as a type?",opts:["A protocol composition — a type conforming to both protocols","An error, & isn't valid between protocols","A protocol that overrides both","An array of protocols"],a:"A protocol composition — a type conforming to both protocols",r:"Protocol composition (&) lets you require conformance to multiple protocols in a single type constraint."},
 {q:"Can you add protocol conformance to a type you didn't write (e.g. a standard library type) via an extension?",opts:["No, only the original type declaration can add conformance","Yes — extend the type and implement the protocol's requirements","Only for classes, not structs or built-in types","Only if the protocol has no requirements"],a:"Yes — extend the type and implement the protocol's requirements",r:"Retroactive conformance via extension is a core Swift feature — e.g. extending Int to conform to a custom protocol."},
],
progs:[
 {t:"InventoryItem protocol + Product struct + closures",body:`Protocol InventoryItem: sku:String, price:Double, quantity:Int{get set}, mutating func restock(by:). Struct Product conforms. Given [Product], filter out out-of-stock items and compute total value with map+reduce.`,
 sol:`protocol InventoryItem {
    var sku: String { get }
    var price: Double { get }
    var quantity: Int { get set }
    mutating func restock(by amount: Int)
}
struct Product: InventoryItem {
    let sku: String; let price: Double; var quantity: Int
    mutating func restock(by amount: Int) { quantity += amount }
}
let inventory = [Product(sku:"A", price:25, quantity:10),
                  Product(sku:"B", price:50, quantity:0)]
let inStock = inventory.filter { $0.quantity > 0 }
let totalValue = inStock.map { $0.price * Double($0.quantity) }.reduce(0, +)
print(totalValue) // 250.0`},
 {t:"Shape protocol with computed area, Circle & Square conform",body:`Protocol Shape { var area: Double { get } }. Structs Circle(radius) and Square(side) conform. Write a function describing the largest shape in an array using max(by:).`,
 sol:`protocol Shape { var area: Double { get } }
struct Circle: Shape {
    let radius: Double
    var area: Double { .pi * radius * radius }
}
struct Square: Shape {
    let side: Double
    var area: Double { side * side }
}
let shapes: [Shape] = [Circle(radius: 2), Square(side: 5)]
if let largest = shapes.max(by: { $0.area < $1.area }) {
    print("Largest area: \\(largest.area)")
}`}
]},

{id:"closures", name:"Closures", notes:`

<li>Closures are self-contained blocks of functionality; can capture variables from their surrounding scope.</li>

<li>Trailing closure syntax: last argument closure written outside the parentheses.</li>
<li><code>map</code> transforms, <code>filter</code> keeps matching elements, <code>reduce</code> combines into one value.</li>
</ul>`,
code:`let names = ["Zoe","Amit","Neha"]

    return { count += 1; return count }       // captures 'count'
}
let counter = makeCounter()
print(counter(), counter(), counter())        // 1 2 3`,

const nav = document.getElementById('nav');
const main = document.getElementById('main');

topics.forEach((t, idx) => {
  const btn = document.createElement('button');
  btn.textContent = t.name;
  btn.onclick = () => select(idx);
  btn.id = 'nav-' + t.id;
  nav.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'topic';
  sec.id = 'sec-' + t.id;

  let mcqHtml = t.mcqs.map((m,i) => `
    <div class="qcard">
      <b>Q${i+1}.</b> ${m.q}
      <div class="opts">${m.opts.map(o=>`• ${o}`).join('<br>')}</div>
      <details><summary>Show answer</summary><p><b>${m.a}</b> — ${m.r}</p></details>
    </div>`).join('');

  let progHtml = t.progs.map((p,i) => `
    <div class="qcard">
      <b>Programming Q${i+1} (10 marks): ${p.t}</b>
      <p>${p.body}</p>
      <details><summary>Show solution</summary><pre>${escapeHtml(p.sol)}</pre></details>
    </div>`).join('');

  sec.innerHTML = `
    <h2>${t.name}</h2>
    <div class="notes">${t.notes}</div>
    <h3>Sample Code</h3>
    <pre>${escapeHtml(t.code)}</pre>
    <h3>MCQs <span class="badge">${t.mcqs.length}</span></h3>
    ${mcqHtml}
    <h3>Programming Questions <span class="badge">${t.progs.length}</span></h3>
    ${progHtml}
  `;
  main.appendChild(sec);
});

function select(idx){
  document.querySelectorAll('.topic').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-' + topics[idx].id).classList.add('active');
  document.getElementById('nav-' + topics[idx].id).classList.add('active');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
select(0);
</script>
</body>
